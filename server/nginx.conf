# /etc/nginx/sites-available/pomodoro.mauriciojuanes.com  (certbot agrega el bloque HTTPS)
server {
    listen 80;
    server_name pomodoro.mauriciojuanes.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;   # /api/wait espera hasta 55 s
        proxy_buffering off;
    }
}
